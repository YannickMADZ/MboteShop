# Variante sans téléchargement npm (connexion lente ou filtrée).
# Lancement : docker compose -f docker-compose.hors-ligne.yml up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  api:
    build:
      context: .
      dockerfile: Dockerfile.hors-ligne
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/mbote_shop}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - mongo

volumes:
  mongo-data:
